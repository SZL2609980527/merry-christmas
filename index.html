<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Merry Christmas</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        overflow: hidden;
        background: #050816;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      canvas#scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: pointer;
      }

      /* ---------- 左上角祝福语 ---------- */
      .greeting {
        position: fixed;
        top: max(22px, env(safe-area-inset-top));
        left: 26px;
        z-index: 2;
        pointer-events: none;
        user-select: none;
      }
      .greeting .row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .moon {
        flex: none;
        margin-top: 6px;
        filter: drop-shadow(0 0 6px rgba(167, 139, 250, .85)) drop-shadow(0 0 18px rgba(99, 102, 241, .5));
        animation: moonSway 5s ease-in-out infinite;
      }
      @keyframes moonSway {
        0%, 100% { transform: rotate(-6deg); }
        50% { transform: rotate(4deg); }
      }
      .greeting h1 {
        margin: 0;
        font-family: "Snell Roundhand", "Apple Chancery", "Segoe Script", "Brush Script MT", Georgia, "Times New Roman", serif;
        font-style: italic;
        font-weight: 500;
        font-size: clamp(30px, 6.2vw, 54px);
        line-height: 1.08;
        letter-spacing: .01em;
        color: #dbeafe;
        text-shadow:
          0 0 6px rgba(125, 211, 252, .55),
          0 0 22px rgba(99, 102, 241, .65),
          0 0 52px rgba(139, 92, 246, .45);
        animation: textGlow 3.6s ease-in-out infinite;
      }
      .greeting h1 .line2 { color: #c4b5fd; }
      @keyframes textGlow {
        0%, 100% { text-shadow: 0 0 6px rgba(125,211,252,.45), 0 0 22px rgba(99,102,241,.55), 0 0 52px rgba(139,92,246,.35); }
        50%      { text-shadow: 0 0 8px rgba(125,211,252,.75), 0 0 30px rgba(99,102,241,.8),  0 0 68px rgba(139,92,246,.55); }
      }
      .greeting p {
        margin: 10px 0 0 2px;
        font-size: clamp(12.5px, 2.6vw, 14.5px);
        letter-spacing: .14em;
        color: rgba(196, 181, 253, .78);
        text-shadow: 0 0 12px rgba(99, 102, 241, .5);
      }

      /* ---------- 底部小提示 ---------- */
      .hint {
        position: fixed;
        left: 0; right: 0;
        bottom: max(18px, env(safe-area-inset-bottom));
        z-index: 2;
        text-align: center;
        pointer-events: none;
        user-select: none;
        font-size: 12.5px;
        letter-spacing: .22em;
        color: rgba(165, 180, 252, .55);
        animation: hintFade 4s ease-in-out infinite;
      }
      @keyframes hintFade {
        0%, 100% { opacity: .45; }
        50% { opacity: .95; }
      }

      @media (max-width: 480px) {
        .greeting { left: 18px; top: max(16px, env(safe-area-inset-top)); }
        .moon { width: 22px; height: 22px; margin-top: 4px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .moon, .greeting h1, .hint { animation: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="蓝紫色粒子圣诞树，点按页面可绽放星光"></canvas>

    <div class="greeting" aria-hidden="true">
      <div class="row">
        <svg class="moon" width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20.6 14.2A8.8 8.8 0 0 1 9.8 3.4a.6.6 0 0 0-.8-.8 10.4 10.4 0 1 0 12.4 12.4.6.6 0 0 0-.8-.8Z" fill="#ddd6fe"/>
        </svg>
        <h1>Merry<br /><span class="line2">Christmas</span></h1>
      </div>
      <p>圣诞快乐 · 愿星光落在你肩上</p>
    </div>

    <div class="hint" aria-hidden="true">轻 点 任 意 处 · 绽 放 星 光</div>

    <script>
      (function () {
        var canvas = document.getElementById('scene');
        var ctx = canvas.getContext('2d');

        var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* 蓝紫色板：天蓝 / 宝蓝 / 靛蓝 / 紫罗兰 / 淡紫 */
        var PALETTE = [
          '#7dd3fc', '#38bdf8', '#0ea5e9',
          '#60a5fa', '#3b82f6', '#2563eb',
          '#818cf8', '#6366f1', '#4f46e5',
          '#a78bfa', '#8b5cf6', '#7c3aed',
          '#c4b5fd', '#ddd6fe', '#bfdbfe'
        ];
        function pick() { return PALETTE[(Math.random() * PALETTE.length) | 0]; }
        function hexToRgb(hex) {
          return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
        }

        var W = 0, H = 0, DPR = 1;
        var cx = 0, baseY = 0, treeH = 0, maxR = 0;
        var trunkH = 0, trunkTopHalf = 0, trunkBotHalf = 0, trunkBotY = 0;

        var tree = [];      // 树粒子
        var trunkP = [];    // 树桩粒子（与树体同一种发光粒子语言）
        var snow = [];      // 雪花
        var bgStars = [];   // 背景星点
        var bursts = [];    // 点击星光簇

        function layout() {
          var s = Math.min(W, H);
          cx = W / 2;
          if (H > W * 1.25) {
            // 竖屏手机：树更高、更居中，避免上方大片空白
            treeH = Math.min(H * 0.50, W * 1.08);
            maxR = W * 0.365;
            baseY = H * 0.815;
          } else {
            treeH = s * 0.58;
            maxR = s * 0.30;
            baseY = H * 0.86;
            if (H < 520) { treeH = s * 0.52; baseY = H * 0.88; }
          }
          // 树桩尺寸：正下方中央，上窄下宽；把树体整体略抬，给树桩留位置
          trunkH = Math.max(26, treeH * 0.17);
          trunkTopHalf = Math.max(7, maxR * 0.105);
          trunkBotHalf = Math.max(11, maxR * 0.185);
          baseY -= trunkH * 0.62;
          trunkBotY = baseY + trunkH * 0.92;
        }

        // 底部收拢：最底几层半径略缩，轮廓不摊开、更像圣诞树
        function tuckFactor(t) {
          if (t >= 0.24) return 1;
          var u = Math.max(t, 0) / 0.24;          // 0 在树底 → 1 在 24% 高度
          var smooth = u * u * (3 - 2 * u);
          return 0.83 + 0.17 * smooth;
        }

        function buildTree() {
          tree = [];
          var count = W < 600 ? 780 : 1150;
          var turns = 7.5; // 螺旋圈数
          for (var i = 0; i < count; i++) {
            var t = Math.random();                    // 0 = 树底, 1 = 树顶
            // 螺旋主线 + 少量内填充，让树体饱满
            var onSpiral = Math.random() < 0.72;
            var angle, rFactor;
            if (onSpiral) {
              angle = t * Math.PI * 2 * turns + (Math.random() - 0.5) * 0.55;
              rFactor = (1 - t) * (0.94 + Math.random() * 0.12) * tuckFactor(t);
            } else {
              angle = Math.random() * Math.PI * 2;
              rFactor = (1 - t) * Math.sqrt(Math.random()) * 0.92 * tuckFactor(t);
            }
            var c = hexToRgb(pick());
            tree.push({
              t: t,
              angle: angle,
              rFactor: Math.max(rFactor, 0.012),
              size: 0.8 + Math.random() * 1.9,
              r: c[0], g: c[1], b: c[2],
              phase: Math.random() * Math.PI * 2,
              twSpeed: 0.6 + Math.random() * 2.2,
              big: Math.random() < 0.045  // 少量大亮点，像挂饰
            });
          }
          // 树顶附近补一圈收尖
          for (var j = 0; j < 40; j++) {
            var tt = 0.93 + Math.random() * 0.07;
            var cc = hexToRgb(pick());
            tree.push({
              t: tt, angle: Math.random() * Math.PI * 2,
              rFactor: (1 - tt) * (0.6 + Math.random() * 0.5),
              size: 0.8 + Math.random() * 1.4,
              r: cc[0], g: cc[1], b: cc[2],
              phase: Math.random() * Math.PI * 2,
              twSpeed: 0.6 + Math.random() * 2.2, big: false
            });
          }
        }

        // 树桩：不用实木，改用同样的蓝紫发光粒子排成上窄下宽的短柱，
        // 稀疏、闪烁、带光晕，边缘自然消散进树底光晕，没有硬轮廓
        function buildTrunk() {
          trunkP = [];
          var topY = baseY - trunkH * 0.30;   // 顶部钻进树冠底部，和树粒子交叠
          var botY = trunkBotY;
          var n = W < 600 ? 58 : 88;
          for (var i = 0; i < n; i++) {
            var v = Math.pow(Math.random(), 0.85);        // 0 顶部 → 1 底部，略偏下密
            var halfW = trunkTopHalf + (trunkBotHalf - trunkTopHalf) * v;
            // 横向分布向中心收拢，越靠底部越往外散开、融进光晕
            var spread = halfW * (1 + Math.max(0, v - 0.72) * 1.15);
            var u = Math.random() * 2 - 1;
            var off = Math.sign(u) * Math.pow(Math.abs(u), 1.35) * spread;
            var c = hexToRgb(pick());
            trunkP.push({
              x: cx + off,
              y: topY + v * (botY - topY) + (Math.random() - 0.5) * 3,
              v: v,
              size: 0.8 + Math.random() * 1.8,
              r: c[0], g: c[1], b: c[2],
              phase: Math.random() * Math.PI * 2,
              twSpeed: 0.6 + Math.random() * 2.0,
              big: Math.random() < 0.05
            });
          }
          // 底部再撒几颗更散、更淡的，像光尘落在地上
          for (var j = 0; j < 16; j++) {
            var cc = hexToRgb(pick());
            var uu = Math.random() * 2 - 1;
            trunkP.push({
              x: cx + uu * trunkBotHalf * (1.5 + Math.random() * 0.9),
              y: botY - Math.random() * trunkH * 0.16,
              v: 1,
              size: 0.7 + Math.random() * 1.3,
              r: cc[0], g: cc[1], b: cc[2],
              phase: Math.random() * Math.PI * 2,
              twSpeed: 0.6 + Math.random() * 2.0,
              big: false,
              dust: true
            });
          }
        }

        function buildSnow() {
          snow = [];
          var n = W < 600 ? 80 : 130;
          for (var i = 0; i < n; i++) {
            snow.push({
              x: Math.random() * W,
              y: Math.random() * H,
              r: 0.7 + Math.random() * 2.1,
              speed: 0.25 + Math.random() * 0.85,
              sway: 0.4 + Math.random() * 1.1,
              phase: Math.random() * Math.PI * 2,
              alpha: 0.35 + Math.random() * 0.55
            });
          }
        }

        function buildBg() {
          bgStars = [];
          var n = W < 600 ? 60 : 100;
          for (var i = 0; i < n; i++) {
            bgStars.push({
              x: Math.random() * W,
              y: Math.random() * H * 0.85,
              r: 0.4 + Math.random() * 1.1,
              phase: Math.random() * Math.PI * 2,
              speed: 0.4 + Math.random() * 1.2,
              violet: Math.random() < 0.45
            });
          }
        }

        function resize() {
          DPR = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth;
          H = window.innerHeight;
          canvas.width = Math.round(W * DPR);
          canvas.height = Math.round(H * DPR);
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          layout();
          buildTree();
          buildTrunk();
          buildSnow();
          buildBg();
        }
        window.addEventListener('resize', resize);
        resize();

        /* ---------- 点击星光绽放 ---------- */
        function spawnBurst(x, y) {
          var parts = [];
          var n = 34;
          for (var i = 0; i < n; i++) {
            var a = (i / n) * Math.PI * 2 + Math.random() * 0.35;
            var sp = 0.6 + Math.random() * 3.1;
            var c = hexToRgb(pick());
            parts.push({
              x: x, y: y,
              vx: Math.cos(a) * sp,
              vy: Math.sin(a) * sp - 0.35,
              life: 1,
              decay: 0.008 + Math.random() * 0.012,
              size: 0.8 + Math.random() * 2.0,
              r: c[0], g: c[1], b: c[2],
              spark: Math.random() < 0.35  // 一部分画成四角星芒
            });
          }
          // 中心闪光
          parts.push({ x: x, y: y, vx: 0, vy: 0, life: 1, decay: 0.03, size: 5.5, r: 221, g: 214, b: 254, spark: true, center: true });
          bursts.push(parts);
          if (bursts.length > 6) bursts.shift();
        }
        canvas.addEventListener('pointerdown', function (e) {
          spawnBurst(e.clientX, e.clientY);
        });

        function drawSpark(x, y, s, color, alpha) {
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(x, y - s);
          ctx.quadraticCurveTo(x, y, x + s, y);
          ctx.quadraticCurveTo(x, y, x, y + s);
          ctx.quadraticCurveTo(x, y, x - s, y);
          ctx.quadraticCurveTo(x, y, x, y - s);
          ctx.fill();
          ctx.restore();
        }

        // 树桩粒子：和树粒子同一套画法（加色混合、外层辉光 + 本体 + 偶尔星芒），
        // 只是位置排成短柱形；越靠底部透明度越低，柔和地沉进地面光晕
        function drawTrunkParticles(time) {
          for (var i = 0; i < trunkP.length; i++) {
            var p = trunkP[i];
            var tw = 0.55 + 0.45 * Math.sin(time * 0.001 * p.twSpeed + p.phase);
            var fade = p.dust ? 0.38 : (1 - p.v * 0.30);
            var alpha = tw * fade * 0.92;
            var size = p.size * (p.big ? 1.6 : 1);
            ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + (alpha * 0.16) + ')';
            ctx.beginPath(); ctx.arc(p.x, p.y, size * 3.1, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + alpha + ')';
            ctx.beginPath(); ctx.arc(p.x, p.y, size, 0, Math.PI * 2); ctx.fill();
            if (p.big && tw > 0.88) {
              drawSpark(p.x, p.y, size * 3.4, 'rgba(221,214,254,1)', (tw - 0.88) * 5);
            }
          }
        }

        function drawStar(x, y, R, time) {
          var pulse = 1 + Math.sin(time * 0.0022) * 0.10;
          var r = R * pulse, ri = r * 0.46;
          // 光晕
          var glow = ctx.createRadialGradient(x, y, 0, x, y, r * 3.4);
          glow.addColorStop(0, 'rgba(196,181,253,0.55)');
          glow.addColorStop(0.35, 'rgba(139,92,246,0.28)');
          glow.addColorStop(1, 'rgba(99,102,241,0)');
          ctx.fillStyle = glow;
          ctx.beginPath(); ctx.arc(x, y, r * 3.4, 0, Math.PI * 2); ctx.fill();

          ctx.save();
          ctx.shadowColor = 'rgba(167,139,250,0.95)';
          ctx.shadowBlur = 22;
          ctx.beginPath();
          for (var i = 0; i < 10; i++) {
            var rad = i % 2 === 0 ? r : ri;
            var a = -Math.PI / 2 + i * Math.PI / 5 + Math.sin(time * 0.0009) * 0.06;
            var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
          var grad = ctx.createLinearGradient(x, y - r, x, y + r);
          grad.addColorStop(0, '#ede9fe');
          grad.addColorStop(0.55, '#c4b5fd');
          grad.addColorStop(1, '#818cf8');
          ctx.fillStyle = grad;
          ctx.fill();
          ctx.restore();
          // 星芯
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.beginPath(); ctx.arc(x, y, r * 0.16, 0, Math.PI * 2); ctx.fill();
        }

        var rotation = 0;
        var last = 0;

        function frame(time) {
          var dt = Math.min(time - last, 50) || 16;
          last = time;
          rotation += dt * (reduced ? 0.00004 : 0.00019); // 缓慢旋转，约 33 秒一圈

          /* 背景：深邃夜空 */
          var bg = ctx.createLinearGradient(0, 0, 0, H);
          bg.addColorStop(0, '#04061a');
          bg.addColorStop(0.55, '#070b26');
          bg.addColorStop(1, '#0d1033');
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, W, H);

          var vg = ctx.createRadialGradient(cx, H * 0.42, 0, cx, H * 0.42, Math.max(W, H) * 0.75);
          vg.addColorStop(0, 'rgba(76, 60, 180, 0.16)');
          vg.addColorStop(0.5, 'rgba(37, 56, 160, 0.07)');
          vg.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = vg;
          ctx.fillRect(0, 0, W, H);

          /* 背景星点 */
          for (var i = 0; i < bgStars.length; i++) {
            var st = bgStars[i];
            var a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(time * 0.001 * st.speed + st.phase));
            ctx.fillStyle = st.violet ? 'rgba(196,181,253,' + a + ')' : 'rgba(147,197,253,' + a + ')';
            ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
          }

          /* 树底柔和光晕（中心落在树桩脚下） */
          var glowY = trunkBotY - trunkH * 0.16;
          var ground = ctx.createRadialGradient(cx, glowY, 0, cx, glowY, maxR * 1.55);
          ground.addColorStop(0, 'rgba(129,140,248,0.34)');
          ground.addColorStop(0.45, 'rgba(99,102,241,0.16)');
          ground.addColorStop(1, 'rgba(99,102,241,0)');
          ctx.save();
          ctx.translate(cx, glowY);
          ctx.scale(1, 0.30);
          ctx.translate(-cx, -glowY);
          ctx.fillStyle = ground;
          ctx.beginPath(); ctx.arc(cx, glowY, maxR * 1.55, 0, Math.PI * 2); ctx.fill();
          ctx.restore();

          /* 树粒子（加色混合，发光感）；树桩粒子同在这一层，先画、垫在树冠下方 */
          ctx.globalCompositeOperation = 'lighter';
          drawTrunkParticles(time);
          for (var j = 0; j < tree.length; j++) {
            var p = tree[j];
            var ang = p.angle + rotation;
            var cos = Math.cos(ang), sin = Math.sin(ang);
            var rr = p.rFactor * maxR;
            var x = cx + cos * rr;
            var y = baseY - p.t * treeH + sin * rr * 0.16;
            var depth = sin * 0.5 + 0.5;               // 0 背面 → 1 正面
            var tw = 0.55 + 0.45 * Math.sin(time * 0.001 * p.twSpeed + p.phase);
            var alpha = (0.16 + 0.84 * depth) * tw;
            var size = p.size * (0.55 + 0.65 * depth) * (p.big ? 1.7 : 1);
            // 外层辉光
            ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + (alpha * 0.16) + ')';
            ctx.beginPath(); ctx.arc(x, y, size * 3.1, 0, Math.PI * 2); ctx.fill();
            // 粒子本体
            ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + alpha + ')';
            ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
            // 大亮点加星芒
            if (p.big && tw > 0.88) {
              drawSpark(x, y, size * 3.4, 'rgba(221,214,254,1)', (tw - 0.88) * 5 * (0.3 + 0.7 * depth));
            }
          }
          ctx.globalCompositeOperation = 'source-over';

          /* 树顶星星 */
          drawStar(cx, baseY - treeH - Math.min(26, treeH * 0.05), Math.max(13, Math.min(W, H) * 0.026), time);

          /* 雪花 */
          var snowSpeedMul = reduced ? 0.35 : 1;
          for (var k = 0; k < snow.length; k++) {
            var f = snow[k];
            f.y += f.speed * snowSpeedMul * (dt / 16);
            f.x += Math.sin(time * 0.001 * f.sway + f.phase) * 0.35;
            if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
            if (f.x > W + 4) f.x = -4; else if (f.x < -4) f.x = W + 4;
            ctx.fillStyle = 'rgba(226,232,255,' + f.alpha + ')';
            ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
          }

          /* 点击绽放的星光 */
          ctx.globalCompositeOperation = 'lighter';
          for (var b = bursts.length - 1; b >= 0; b--) {
            var parts = bursts[b];
            var alive = false;
            for (var q = 0; q < parts.length; q++) {
              var pt = parts[q];
              if (pt.life <= 0) continue;
              alive = true;
              pt.life -= pt.decay * (dt / 16);
              pt.x += pt.vx * (dt / 16);
              pt.y += pt.vy * (dt / 16);
              pt.vx *= 0.965; pt.vy = pt.vy * 0.965 + 0.012;
              var al = Math.max(pt.life, 0);
              if (pt.spark) {
                drawSpark(pt.x, pt.y, pt.size * 3.2 * al + 1, 'rgb(' + pt.r + ',' + pt.g + ',' + pt.b + ')', al * 0.9);
              } else {
                ctx.fillStyle = 'rgba(' + pt.r + ',' + pt.g + ',' + pt.b + ',' + (al * 0.35) + ')';
                ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * 3, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(' + pt.r + ',' + pt.g + ',' + pt.b + ',' + al + ')';
                ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
              }
            }
            if (!alive) bursts.splice(b, 1);
          }
          ctx.globalCompositeOperation = 'source-over';

          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
